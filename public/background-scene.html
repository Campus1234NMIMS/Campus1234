<script type="module">

// =====================================================================
// The Last Light.
// A storm at night and a lighthouse alone on its rock. Lightning moves
// inside the clouds and lights them from within, the beam turns through
// the rain and the spray, and the sea throws itself at the rock. Then the
// sea draws back, and a wave taller than the lighthouse rises out of the
// dark and breaks over it. When the spray falls, the light is still turning.
//

// space (fine where the eye is, coarse at the horizon); the great wave is
// one more term, with its own shape, that leans and curls as it breaks.

// and the light the beams scatter along each ray is added up in closed
